function getUserId() {
  let id = localStorage.getItem("daily_english_uid");
  if (!id) { id = "user_" + Math.random().toString(36).slice(2, 10); localStorage.setItem("daily_english_uid", id); }
  return id;
}
const USER_ID = getUserId();
function calcNextReview(reviewCount, easeFactor, quality) {
  let newEase = easeFactor + (0.1 - (2 - quality) * (0.08 + (2 - quality) * 0.02));
  newEase = Math.max(1.3, newEase);
  let interval;
  if (quality === 0) { interval = 1; }
  else if (reviewCount === 0) { interval = 1; }
  else if (reviewCount === 1) { interval = 3; }
  else { interval = Math.round((reviewCount) * newEase); }
  const next = new Date();
  next.setDate(next.getDate() + interval);
  return { nextReview: next.toISOString().split("T")[0], newEase, interval };
}
async function saveWordToReview(word, chineseMeaning, partOfSpeech) {
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const nextReview = tomorrow.toISOString().split("T")[0];
  const { data: existing } = await sb.from("user_progress")
    .select("id").eq("user_id", USER_ID).eq("content", word).limit(1);
  if (existing && existing.length > 0) return;
  await sb.from("user_progress").insert({
    user_id: USER_ID,
    content_type: partOfSpeech === "phrase" ? "phrase" : "word",
    content: word,
    translation: chineseMeaning,
    next_review: nextReview,
    review_count: 0,
    ease_factor: 2.5,
  });
}
async function loadTodayReviews() {
  const today = new Date().toISOString().split("T")[0];
  const { data, error } = await sb
    .from("user_progress")
    .select("*")
    .eq("user_id", USER_ID)
    .lte("next_review", today)
    .order("next_review", { ascending: true })
    .limit(15);
  if (error) return [];
  return data || [];
}
async function updateReview(id, reviewCount, easeFactor, quality) {
  const { nextReview, newEase } = calcNextReview(reviewCount, easeFactor, quality);
  await sb.from("user_progress").update({
    next_review: nextReview,
    review_count: reviewCount + 1,
    ease_factor: newEase,
  }).eq("id", id);
}
const TOPICS = [
  { id:"daily",    label:"日常生活", emoji:"🏠", desc:"吃飯、購物、交通、家居",   color:{bg:"#0d1b2a",accent:"#4a9eda",light:"#112233"} },

  { id:"work",     label:"職場英文", emoji:"💼", desc:"開會、email、簡報、同事",   color:{bg:"#1a1030",accent:"#9b72cf",light:"#221540"} },
  { id:"social",   label:"社交聊天", emoji:"💬", desc:"朋友、約會、聚會、閒聊",   color:{bg:"#2a1000",accent:"#ff7c3a",light:"#3a1800"} },
  { id:"drama",    label:"追劇口語", emoji:"🎬", desc:"影集、電影常見片語",         color:{bg:"#200a14",accent:"#e94560",light:"#2e0f1e"} },
  { id:"food",     label:"飲食文化", emoji:"🍜", desc:"餐廳、點餐、食物描述",       color:{bg:"#241500",accent:"#f5a623",light:"#321c00"} },
  { id:"health",   label:"健康生活", emoji:"💪", desc:"運動、飲食、身體狀況",       color:{bg:"#0a2010",accent:"#40c070",light:"#0e2e16"} },
  { id:"shopping", label:"購物消費", emoji:"🛍️", desc:"砍價、比較、付款",           color:{bg:"#280a20",accent:"#e06090",light:"#361230"} },
];
const LEVELS = [
  { id:"beginner",     label:"初學者", emoji:"🌱", minWords:0,    desc:"超基礎日常單字" },
  { id:"elementary",   label:"初級",   emoji:"🌿", minWords:300,  desc:"常用片語" },
  { id:"intermediate", label:"中級",   emoji:"🌳", minWords:500,  desc:"口語表達" },
  { id:"advanced",     label:"高級",   emoji:"🏆", minWords:1000, desc:"地道慣用語" },
];
const STORAGE_KEY = "daily_english_v5";
function loadData() { try { const r=localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); } catch(e){} return null; }
function saveData(d) { try { localStorage.setItem(STORAGE_KEY,JSON.stringify(d)); } catch(e){} }
function getToday() { return new Date().toISOString().slice(0,10); }
function getCurrentLevel(w) { return LEVELS.slice().reverse().find(l=>w>=l.minWords)||LEVELS[0]; }
function getNextLevel(w) { return LEVELS.find(l=>l.minWords>w)||null; }
function getTopicColor(id) { return TOPICS.find(t=>t.id===id)?.color||TOPICS[0].color; }
async function fetchWords(topic,level,count=8,seenWords=[]) {
  const res = await fetch("/api/words",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,level,count,seenWords})});
  const data = await res.json();
  if(!data.words) throw new Error(data.error||"No words");
  return data.words;
}
function strictMatch(heard,target) {
  const norm=s=>s.toLowerCase().replace(/[^a-z\s]/g,"").trim();
  const h=norm(heard),t=norm(target);
  if(h===t) return true;
  if(h.includes(t)||t.includes(h)) return true;
  const tw=t.split(" "), hw=h.split(" ");
  if(tw.length>1){
    const matchCount=tw.filter(tw=>hw.some(hw=>{
      if(hw===tw) return true;
      if(Math.abs(hw.length-tw.length)>2) return false;
      let d=0;
      const s=hw.length<tw.length?hw:tw, l=hw.length<tw.length?tw:hw;
      for(let i=0;i<s.length;i++) if(s[i]!==l[i]) d++;
      return (d+l.length-s.length)<=2;
    })).length;
    return matchCount/tw.length>=0.7;
  }
  if(Math.abs(h.length-t.length)>3) return false;
  let diff=0;
  const s=h.length<t.length?h:t, l=h.length<t.length?t:h;
  for(let i=0;i<s.length;i++) if(s[i]!==l[i]) diff++;
  return (diff+l.length-s.length)<=2;
}
function playVictorySound() {
  try {
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const notes=[
      {freq:523,start:0,dur:0.10,vol:0.35},{freq:659,start:0.09,dur:0.10,vol:0.35},
      {freq:784,start:0.18,dur:0.10,vol:0.35},{freq:1047,start:0.27,dur:0.10,vol:0.4},
      {freq:1319,start:0.36,dur:0.10,vol:0.4},{freq:1568,start:0.45,dur:0.10,vol:0.4},
      {freq:2093,start:0.54,dur:0.30,vol:0.5},
    ];
    notes.forEach(({freq,start,dur,vol})=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type="sine";
      osc.frequency.setValueAtTime(freq,ctx.currentTime+start);
      gain.gain.setValueAtTime(0,ctx.currentTime+start);
      gain.gain.linearRampToValueAtTime(vol,ctx.currentTime+start+0.015);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
      osc.start(ctx.currentTime+start);
      osc.stop(ctx.currentTime+start+dur+0.05);
    });
  } catch(e){}
}
function SpeakBtn({text,label,accent,rate}) {
  const [playing,setPlaying]=useState(false);
  function speak() {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel(); setPlaying(true);
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=rate||0.85;
    const v=window.speechSynthesis.getVoices();
    const ev=v.find(v=>v.lang==="en-US")||v.find(v=>v.lang.startsWith("en"));
    if(ev) u.voice=ev;
    u.onend=()=>setPlaying(false); u.onerror=()=>setPlaying(false);
    window.speechSynthesis.speak(u);
  }
  return(
    <button onClick={speak} style={{display:"inline-flex",alignItems:"center",gap:"5px",background:playing?`${accent}33`:"rgba(255,255,255,0.08)",border:`1px solid ${playing?accent:"rgba(255,255,255,0.15)"}`,color:playing?accent:"rgba(255,255,255,0.6)",borderRadius:"20px",padding:"6px 14px",fontSize:"13px",cursor:"pointer"}}>
      {playing?"🔊":"🔈"} {label}
    </button>
  );
}
function SpeechPractice({word,accent,onPass}) {
  const [status,setStatus]=useState("idle");
  const [heard,setHeard]=useState("");
  const [errorMsg,setErrorMsg]=useState("");
  const recRef=useRef(null); const gotRef=useRef(false);
  function startListen() {
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setStatus("unsupported");return;}
    if(recRef.current){try{recRef.current.abort();}catch(e){}}
    setStatus("listening"); setHeard(""); setErrorMsg(""); gotRef.current=false;
    const rec=new SR(); recRef.current=rec;
    rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=5;
    rec.onresult=(e)=>{
      gotRef.current=true;
      const ts=[];
      for(let i=0;i<e.results.length;i++) for(let j=0;j<e.results[i].length;j++) ts.push(e.results[i][j].transcript);
      setHeard(ts[0]||"");
      const ok=ts.some(t=>strictMatch(t,word));
      setStatus(ok?"success":"fail");
      if(ok){playVictorySound(); if(onPass) onPass();}
    };
    rec.onerror=(e)=>{
      gotRef.current=true;
      if(e.error==="not-allowed") setErrorMsg("請允許麥克風權限");
      else if(e.error==="no-speech") setErrorMsg("沒偵測到聲音，說大聲一點");
      else setErrorMsg("請再試一次");
      setStatus("error");
    };
    rec.onend=()=>{if(!gotRef.current){setErrorMsg("沒收到語音，靠近麥克風");setStatus("error");}};
    try{rec.start();}catch(e){setErrorMsg("無法啟動麥克風");setStatus("error");}
  }
  function reset(){setStatus("idle");setHeard("");setErrorMsg("");gotRef.current=false;}
  if(status==="unsupported") return(
    <div style={{padding:"10px",background:"rgba(255,100,100,0.08)",borderRadius:"10px",fontSize:"12px",color:"#f5a623",textAlign:"center"}}>
      ⚠️ 請用 <strong>Chrome</strong> 才能使用跟讀功能
    </div>
  );
  return(
    <div style={{padding:"14px",background:"rgba(255,255,255,0.04)",borderRadius:"14px"}}>
      <div style={{fontSize:"11px",letterSpacing:"2px",color:accent,textTransform:"uppercase",marginBottom:"8px"}}>🎤 跟讀練習</div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
        <SpeakBtn text={word} label="聽發音" accent={accent} rate={0.65}/>
        {status==="idle"&&<button onClick={startListen} style={{display:"inline-flex",alignItems:"center",gap:"6px",background:accent,border:"none",color:"#fff",borderRadius:"20px",padding:"7px 16px",fontSize:"13px",cursor:"pointer",fontWeight:"700"}}>🎤 我來念</button>}
        {status==="listening"&&(
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <span style={{color:"#f5a623",fontSize:"13px"}}>🔴 聆聽中...</span>
            <button onClick={reset} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#777",borderRadius:"10px",padding:"4px 10px",fontSize:"12px",cursor:"pointer"}}>取消</button>
          </div>
        )}
        {status==="success"&&(
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <span style={{fontSize:"22px"}}>✅</span>
            <div>
              <div style={{color:"#52b788",fontSize:"14px",fontWeight:"700"}}>發音正確！</div>
              {heard&&<div style={{fontSize:"11px",color:"#555"}}>辨識：「{heard}」</div>}
            </div>
            <button onClick={reset} style={{background:"rgba(82,183,136,0.12)",border:"1px solid rgba(82,183,136,0.3)",color:"#52b788",borderRadius:"10px",padding:"4px 10px",fontSize:"11px",cursor:"pointer",marginLeft:"4px"}}>再練</button>
          </div>
        )}
        {status==="fail"&&(
          <div style={{display:"flex",flexDirection:"column",gap:"8px",flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
              <span style={{fontSize:"22px"}}>❌</span>
              <div>
                <div style={{color:"#e94560",fontSize:"14px",fontWeight:"700"}}>再試一次！</div>
                {heard&&<div style={{fontSize:"11px",color:"#555"}}>你說：「{heard}」→ 目標：「{word}」</div>}
              </div>
            </div>
            <div style={{display:"flex",gap:"8px"}}>
              <button onClick={startListen} style={{background:accent,border:"none",color:"#fff",borderRadius:"12px",padding:"6px 14px",fontSize:"12px",cursor:"pointer",fontWeight:"700"}}>🎤 再念</button>
              <SpeakBtn text={word} label="慢速聽" accent={accent} rate={0.5}/>
            </div>
          </div>
        )}
        {status==="error"&&(
          <div style={{display:"flex",flexDirection:"column",gap:"6px",flex:1}}>
            <div style={{fontSize:"12px",color:"#f5a623"}}>⚠️ {errorMsg}</div>
            <button onClick={startListen} style={{alignSelf:"flex-start",background:`${accent}22`,border:`1px solid ${accent}55`,color:accent,borderRadius:"10px",padding:"5px 12px",fontSize:"12px",cursor:"pointer"}}>🎤 重試</button>
          </div>
        )}
      </div>
    </div>
  );
}
function ReviewScreen({reviews, accent, onDone}) {
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [done, setDone] = useState(false);
  useEffect(() => {
    if (!reviews || reviews.length === 0) return;
    const timer = setTimeout(() => playWord(reviews[idx]?.content), 500);
    return () => clearTimeout(timer);
  }, [idx, reviews]);
  function playWord(word) {
    if (!word || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.75;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.startsWith("en"));
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }
  if (!reviews || reviews.length === 0) {
    return (
      <div style={{textAlign:"center",padding:"60px 20px"}}>
        <div style={{fontSize:"48px",marginBottom:"16px"}}>🎉</div>
        <div style={{fontSize:"18px",color:"#fff",marginBottom:"8px",fontWeight:"600"}}>今天沒有複習任務！</div>
        <div style={{fontSize:"13px",color:"#666",marginBottom:"28px"}}>繼續學習新單字吧</div>
        <button onClick={onDone} style={{background:accent,border:"none",color:"#fff",borderRadius:"14px",padding:"13px 32px",fontSize:"15px",cursor:"pointer",fontWeight:"700"}}>學新單字 →</button>
      </div>
    );
  }
  if (done) {
    return (
      <div style={{textAlign:"center",padding:"60px 20px"}}>
        <div style={{fontSize:"52px",marginBottom:"16px"}}>{correct===reviews.length?"🔥":"💪"}</div>
        <div style={{fontSize:"26px",fontWeight:"700",color:"#fff",marginBottom:"8px"}}>{correct} / {reviews.length} 答對</div>
        <div style={{fontSize:"13px",color:"#888",marginBottom:"8px"}}>複習完成！間隔已自動調整</div>
        <div style={{fontSize:"12px",color:"#555",marginBottom:"28px"}}>答對的單字下次會更晚出現 ✨</div>
        <button onClick={onDone} style={{background:accent,border:"none",color:"#fff",borderRadius:"14px",padding:"13px 32px",fontSize:"15px",cursor:"pointer",fontWeight:"700"}}>學新單字 →</button>
      </div>
    );
  }
  const current = reviews[idx];
  const otherReviews = reviews.filter((_,i)=>i!==idx);
  const pool = [...otherReviews].sort(()=>Math.random()-0.5).slice(0,2);
  while(pool.length < 2) pool.push({content:"...", translation:"..."});
  const options = [
    ...pool.slice(0,2).map(p=>({word:p.content,cn:p.translation})),
    {word:current.content, cn:current.translation}
  ].sort(()=>Math.random()-0.5);
  async function handleSelect(opt) {
    if (selected !== null) return;
    setSelected(opt);
    const isCorrect = opt.word === current.content;
    if (isCorrect) { setCorrect(c=>c+1); playVictorySound(); }
    await updateReview(current.id, current.review_count, current.ease_factor, isCorrect?2:0);
  }
  function next() {
    if (idx + 1 >= reviews.length) { setDone(true); return; }
    setIdx(i=>i+1); setSelected(null);
  }
  const { nextReview: previewNext } = selected
    ? calcNextReview(current.review_count, current.ease_factor, selected.word===current.content?2:0)
    : { nextReview: "" };
  return (
    <div style={{maxWidth:"460px",margin:"0 auto",padding:"16px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
        <div style={{fontSize:"12px",color:"#f5a623",fontFamily:"monospace"}}>🔁 複習 {idx+1} / {reviews.length}</div>
        <div style={{fontSize:"12px",color:"#52b788",fontFamily:"monospace"}}>✓ {correct}</div>
      </div>
      <div style={{height:"3px",background:"rgba(255,255,255,0.07)",borderRadius:"3px",marginBottom:"20px",overflow:"hidden"}}>
        <div style={{height:"100%",background:accent,borderRadius:"3px",width:`${(idx/reviews.length)*100}%`,transition:"width 0.3s ease"}}/>
      </div>
      <div style={{background:"rgba(255,255,255,0.05)",borderRadius:"16px",padding:"32px 20px",textAlign:"center",marginBottom:"20px",border:`1px solid ${accent}33`}}>
        <div style={{fontSize:"11px",letterSpacing:"2px",color:accent,textTransform:"uppercase",marginBottom:"16px",fontFamily:"monospace"}}>
          👂 聽發音，選出正確的中文意思
        </div>
        <button onClick={()=>playWord(current.content)} style={{width:"80px",height:"80px",borderRadius:"50%",background:`${accent}22`,border:`2px solid ${accent}`,color:accent,fontSize:"32px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px"}}>
          🔊
        </button>
        <div style={{fontSize:"12px",color:"#555"}}>點擊重聽</div>
        {selected && (
          <div style={{marginTop:"16px",padding:"10px",background:`${accent}11`,borderRadius:"10px"}}>
            <div style={{fontSize:"22px",fontWeight:"700",color:"#fff"}}>{current.content}</div>
          </div>
        )}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"16px"}}>
        {options.map((opt,i)=>{
          let bg="rgba(255,255,255,0.06)",border="1px solid rgba(255,255,255,0.1)",color="#ccc";
          if(selected!==null){
            if(opt.word===current.content){bg="rgba(82,183,136,0.2)";border="1px solid #52b788";color="#52b788";}
            else if(opt.word===selected.word){bg="rgba(233,69,96,0.2)";border="1px solid #e94560";color="#e94560";}
          }
          return(
            <button key={i} onClick={()=>handleSelect(opt)} style={{background:bg,border,color,borderRadius:"12px",padding:"18px 8px",fontSize:"14px",cursor:selected?"default":"pointer",fontWeight:"600",transition:"all 0.2s",fontFamily:"inherit",lineHeight:"1.4"}}>
              {opt.cn}
            </button>
          );
        })}
      </div>
      {selected && (
        <>
          <div style={{padding:"12px",background:"rgba(255,255,255,0.04)",borderRadius:"10px",fontSize:"12px",color:"#888",textAlign:"center",marginBottom:"12px"}}>
            {selected.word===current.content
              ? <span style={{color:"#52b788"}}>✅ 答對！下次 <strong>{previewNext}</strong> 複習</span>
              : <span style={{color:"#e94560"}}>❌ 正確答案：<strong style={{color:"#fff"}}>{current.content}</strong>　明天再來一次</span>
            }
          </div>

  function startCorrectionPractice() {
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return;
    if(practiceRecRef.current){try{practiceRecRef.current.abort();}catch(e){}}
    setPracticeStatus("listening");
    const rec = new SR(); practiceRecRef.current = rec;
    rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=5;
    rec.onresult=(e)=>{
      const heard = Array.from({length:e.results.length},(_,i)=>
        Array.from({length:e.results[i].length},(_,j)=>e.results[i][j].transcript)
      ).flat();
      const target = correction?.correction || "";
      const ok = heard.some(h => strictMatch(h, target));
      const targetWords = target.toLowerCase().replace(/[^a-z\s]/g,"").split(" ").filter(w=>w.length>2);
      const heardAll = heard.join(" ").toLowerCase();
      const keyWordsMatch = targetWords.length>0 && targetWords.filter(w=>heardAll.includes(w)).length/targetWords.length>=0.7;
      setPracticeStatus((ok||keyWordsMatch) ? "success" : "fail");
      if(ok) playVictorySound();
    };
    rec.onerror=()=>setPracticeStatus("fail");
    rec.onend=()=>{ setPracticeStatus(s => s==="listening" ? "fail" : s); };
    try{rec.start();}catch(e){setPracticeStatus("fail");}
  }

  async function dismissCorrection() {

  function speakText(text) {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=0.88;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.startsWith("en"));
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }

  async function startListening() {
    setListening(true); setListenError("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      const mediaRecorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];
      mediaRecorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: mimeType });
        const reader = new FileReader();
        reader.onloadend = async () => {
          const base64 = reader.result.split(',')[1];
          try {
            const res = await fetch('/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ useWhisper: true, audioBase64: base64, mimeType })
            });
            const data = await res.json();
            const text = data.transcript || '';
            setListening(false);
            if(text.trim()) {
              handleUserSay(text);
            } else {
              setListenError(data.error ? "錯誤：" + data.error.slice(0,80) : "沒聽清楚，請再試");
            }
          } catch(e) {
            setListening(false);
            setListenError("辨識失敗，請再試");
          }
        };
        reader.readAsDataURL(blob);
      };
      recRef.current = mediaRecorder;
      mediaRecorder.start();
      setTimeout(() => {
        if(mediaRecorder.state === 'recording') mediaRecorder.stop();
      }, 6000);
    } catch(e) {
      setListening(false);
      setListenError("請允許麥克風權限");
    }
  }

  async function handleUserSay(userText) {

    const hasChinese = /[一-鿿]/.test(userText);

          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({max_tokens:200, messages:[{role:"user", content:`把這句話翻譯成最自然的英文口語，只輸出JSON：
{"correction":"英文說法","correctionCn":"${userText}","coachComment":"活潑一句話說這個怎麼說（15字內）"}`}]})

        const trParsed = JSON.parse(trText.replace(/\`\`\`json|\`\`\`/g,"").trim());

      } catch(e) {}
    } else {
      try {
        const checkRes = await fetch("/api/chat", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({max_tokens:300, messages:[{role:"user", content:`你是活潑友善的英文教練。分析這句話：「${userText}」

情況一：句子裡有中文（中英混雜或純中文）
→ 回傳JSON：{"hasError": true, "type": "chinese", "correction": "完整自然的英文說法", "correctionCn": "中文對照", "coachComment": "活潑說明（15字以內）"}

情況二：純英文但不自然或有錯誤
→ 回傳JSON：{"hasError": true, "type": "error", "correction": "正確自然的英文說法", "correctionCn": "中文翻譯", "coachComment": "活潑口語說明（15字以內）"}

情況三：純英文且完全正確自然
→ 回傳：{"hasError": false}

只輸出JSON，不要其他文字。`}]})
        });
        const checkData = await checkRes.json();
        const checkText = checkData.content?.[0]?.text || "{}";
        const parsed = JSON.parse(checkText.replace(/```json|```/g,"").trim());
        if(parsed.hasError) correction = parsed;
      } catch(e) {}
    }

    setAiThinking(false);

    if(correction) {

    if(newCount >= MAX_TURNS) {

  async function continueConversation(currentTurns, currentCount, currentScenario) {
    setAiThinking(true);
    try {
      const allHistory = currentTurns.map(t=>({role:t.role==="ai"?"assistant":"user", content:t.text}));
      const firstUserIdx = allHistory.findIndex(m => m.role === "user");
      const history = firstUserIdx >= 0 ? allHistory.slice(firstUserIdx) : allHistory;

      // ── 改良版 system prompt：角色一致、不自相矛盾 ──
      const sysPrompt = `You are Jamie, a friendly Taiwanese-American texting a friend in English.
Scene: ${currentScenario?.scenario}
IMPORTANT: You are the one who initiated this conversation. Stay 100% consistent with what you said before.

Rules:
- NEVER contradict yourself. If you invited them to do something, you are going too — you cannot suddenly say you can't make it or have other plans.
- React naturally to what they just said: "Oh nice!", "Haha that's fair", "Aw man", "No way!", "That works!"
- Max 1-2 sentences, under 15 words total
- Use contractions always: I'm, can't, wanna, gonna, gotta, that's
- Sometimes react with just 2-4 words: "Same lol", "No way!", "Oof totally"
- Ask a short follow-up OR just react — don't always end with a question
- Round ${currentCount} of ${MAX_TURNS}${currentCount >= MAX_TURNS - 1 ? " — wrap up warmly, like ending a text chat with a friend" : ""}
- English only, zero formal language`;

      const res = await fetch("/api/chat", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({max_tokens:200, system: sysPrompt, messages:history})
      });
      const data = await res.json();
      const aiText = data.content?.[0]?.text || "Haha nice! Tell me more.";
      let aiCn = "";
      try {
        const tr = await fetch("/api/chat", {
          method:"POST", headers:{"Content-Type":"application/json"},

        });
        const td = await tr.json();
        aiCn = td.content?.[0]?.text || "";
      } catch(e) {}
      setTurns(prev=>[...prev,{role:"ai",text:aiText,cn:aiCn}]);
      speakText(aiText);
    } catch(e) {
      setTurns(prev=>[...prev,{role:"ai",text:"That's interesting! Go on.",cn:"有意思！繼續說。"}]);
    }
    setAiThinking(false);
  }

  async function generateFeedback(allTurns) {
    setPhase("feedback_loading");
    const userLines = allTurns.filter(t=>t.role==="user").map(t=>t.text).join("\n");
    const prompt = `你是專業英文教練。分析這個台灣學習者的英文對話：
場景：${scenario?.scenario}
對話內容：${userLines}
目標單字：${scenario?.targetWords?.join(", ")||"無"}

用繁體中文給出簡潔回饋，嚴格用以下JSON格式：
{"score":"A/B/C/D","mostUnnatural":"最不自然的一句（英文原句）+ 一句話說為什麼","wordsUsed":"用對的詞x個，用錯或漏掉的詞","nativeVersion":"如果是native speaker，剛才最關鍵的那一句會怎麼說（英文示範）"}`;
    try {
      const res = await fetch("/api/chat", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({max_tokens:400, messages:[{role:"user",content:prompt}]})
      });
      const data = await res.json();
      const text = data.content?.[0]?.text||"";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setFeedback(parsed);
    } catch(e) {
      setFeedback({score:"B",mostUnnatural:"分析失敗，請再試一次。",wordsUsed:"—",nativeVersion:"—"});
    }
    setPhase("feedback");
  }

  function reset() {
    setPhase("intro"); setScenario(null); setTurns([]);
    setTurnCount(0); setFeedback(null); setListenError("");
    setCorrection(null); setCorrectionPhase(null); setPracticeStatus("idle");
  }

  const scoreColor = {"A":"#52b788","B":"#4a9eda","C":"#f5a623","D":"#e94560"};

  if(phase==="intro") return (
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 20px",textAlign:"center"}}>

              )}
              {practiceStatus==="success"&&(

                  <div style={{textAlign:"center",padding:"12px 8px"}}>
                    <div style={{fontSize:"36px",marginBottom:"4px"}}>✅</div>

                    <button onClick={dismissCorrection} style={{width:"100%",background:"#52b788",border:"none",color:"#fff",borderRadius:"14px",padding:"14px",fontSize:"16px",cursor:"pointer",fontWeight:"700",boxShadow:"0 4px 12px rgba(82,183,136,0.4)"}}>
                      繼續對話 → <span style={{fontSize:"12px",opacity:0.8}}>(自動繼續)</span>
                    </button>
                  </div>
                </AutoContinue>
              )}
              {practiceStatus==="fail"&&(
                <div>
                  <div style={{textAlign:"center",padding:"8px",marginBottom:"8px"}}>
                    <div style={{fontSize:"22px"}}>❌</div>
                    <div style={{fontSize:"12px",color:"#e94560"}}>再試一次！</div>
                  </div>
                  <div style={{display:"flex",gap:"8px"}}>
                    <button onClick={()=>{setPracticeStatus("idle");}} style={{flex:1,background:"#e94560",border:"none",color:"#fff",borderRadius:"12px",padding:"10px",fontSize:"13px",cursor:"pointer",fontWeight:"700"}}>🎙️ 再說</button>
                    <button onClick={dismissCorrection} style={{flex:1,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",color:"#888",borderRadius:"12px",padding:"10px",fontSize:"13px",cursor:"pointer"}}>跳過，繼續</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}
      <div style={{padding:"12px 14px",borderTop:`1px solid ${accent}22`,flexShrink:0}}>
        {listenError&&<div style={{fontSize:"12px",color:"#f5a623",marginBottom:"8px",textAlign:"center"}}>{listenError}</div>}
        {!listening&&!aiThinking&&!correctionPhase&&(
          <button onClick={startListening} style={{width:"100%",background:accent,border:"none",color:"#fff",borderRadius:"14px",padding:"14px",fontSize:"15px",cursor:"pointer",fontWeight:"700",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px"}}>
            🎙️ 說話
          </button>
        )}
        {listening&&!correctionPhase&&(
          <div style={{textAlign:"center",padding:"14px"}}>
            <div style={{fontSize:"28px",marginBottom:"4px"}}>🔴</div>
            <div style={{fontSize:"13px",color:"#f5a623"}}>錄音中（最多6秒）... 說完按「完成」</div>
            <button onClick={()=>{if(recRef.current&&recRef.current.state==="recording")recRef.current.stop();setListening(false);}} style={{marginTop:"8px",background:"none",border:"1px solid #555",color:"#777",borderRadius:"10px",padding:"4px 14px",fontSize:"12px",cursor:"pointer"}}>完成</button>
          </div>
        )}
        {aiThinking&&(
          <div style={{textAlign:"center",padding:"14px",fontSize:"13px",color:"#555"}}>AI 回應中...</div>
        )}
      </div>
    </div>
  );
}
function LevelUpModal({level,accent,onClose}) {
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>

        <div style={{fontSize:"80px",marginBottom:"16px"}}>{level.emoji}</div>
        <div style={{fontSize:"13px",letterSpacing:"4px",textTransform:"uppercase",color:accent,marginBottom:"8px"}}>Level Up!</div>
        <div style={{fontSize:"30px",fontWeight:"700",color:"#fff",marginBottom:"8px"}}>{level.label}</div>
        <div style={{fontSize:"14px",color:"#777",marginBottom:"28px"}}>{level.desc} 單字解鎖</div>
        <button onClick={onClose} style={{background:accent,border:"none",color:"#fff",borderRadius:"14px",padding:"14px 36px",fontSize:"16px",cursor:"pointer",fontWeight:"700"}}>繼續練習！</button>
      </div>
    </div>
  );
}
function App() {
  const [appData,setAppData]=useState(null);
  const [screen,setScreen]=useState("init");
  const [history,setHistory]=useState([]);
  const [wordQueue,setWordQueue]=useState([]);
  const [currentIdx,setCurrentIdx]=useState(-1);
  const [currentWord,setCurrentWord]=useState(null);
  const [loading,setLoading]=useState(false);
  const [loadError,setLoadError]=useState(null);
  const [revealed,setRevealed]=useState(false);
  const [speechPassed,setSpeechPassed]=useState(false);
  const [showStreak,setShowStreak]=useState(false);
  const [showLevelUp,setShowLevelUp]=useState(null);
  const [reviews,setReviews]=useState([]);
  const [reviewCount,setReviewCount]=useState(0);
  const [activeTab,setActiveTab]=useState("learn");
  const loadingRef=useRef(false);
  const appDataRef = useRef(null);
  useEffect(() => { appDataRef.current = appData; }, [appData]);
  const isInHistory=currentIdx>=0;
  const displayWord=isInHistory?history[currentIdx]:currentWord;
  useEffect(()=>{
    async function init() {
      const data=loadData();
      if(!data||!data.topic){setScreen("setup");return;}
      setAppData(data);
      appDataRef.current = data;
      const today=getToday();
      let updated=data;
      if(data.lastCheckin!==today){
        const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
        const yStr=yesterday.toISOString().slice(0,10);
        const newStreak=data.lastCheckin===yStr?(data.streak||0)+1:1;
        updated={...data,lastCheckin:today,streak:newStreak};
        setAppData(updated);
        appDataRef.current = updated;
        saveData(updated);
        if(newStreak>(data.streak||0)){setShowStreak(true);setTimeout(()=>setShowStreak(false),2500);}
      }
      const todayReviews = await loadTodayReviews();
      setReviews(todayReviews);
      setReviewCount(todayReviews.length);
      if(todayReviews.length>0){
        setScreen("review");
      } else {
        setScreen("main");
        startLearning(updated);
      }
    }
    init();
  },[]);
  function startLearning(data) {
    if(data.savedQueue&&data.savedQueue.length>0){
      setCurrentWord(data.savedQueue[0]);
      setWordQueue(data.savedQueue.slice(1));
      if(data.savedQueue.length<=3) loadMoreWords(data);
    } else {
      loadMoreWords(data);
    }
  }
  async function loadMoreWords(data) {
    if(loadingRef.current) return;
    loadingRef.current=true; setLoading(true); setLoadError(null);
    try{
      const level=getCurrentLevel(data.totalWords||0);
      const seenWords=(data.seenWords||[]).slice(-50);
      const words=await fetchWords(data.topic,level.id,8,seenWords);
      setWordQueue(prev=>[...prev,...words]);
      setCurrentWord(prev=>{
        if(!prev&&words.length>0){
          const latest = appDataRef.current || data;
          saveData({...latest,savedQueue:words});
          setWordQueue(words.slice(1));
          return words[0];
        }
        return prev;
      });
    }catch(e){setLoadError("無法生成單字，請稍後再試");}
    finally{loadingRef.current=false;setLoading(false);}
  }
  async function handleNext() {
    if(isInHistory){
      const nextIdx=currentIdx+1;
      if(nextIdx>=history.length){setCurrentIdx(-1);}
      else{setCurrentIdx(nextIdx);setCurrentWord(history[nextIdx]);}
      setRevealed(false);setSpeechPassed(false);
      return;
    }
    const data = appDataRef.current;
    if (!data) return;
    const today=getToday();
    const todayKey=`today_${today}`;
    const freshFromStorage = loadData();
    const baseTotalWords = freshFromStorage?.totalWords ?? data.totalWords ?? 0;
    const newTodayCount=(data[todayKey]||0)+1;
    const newTotal = baseTotalWords + 1;
    const oldLevel=getCurrentLevel(baseTotalWords);
    const newLevel=getCurrentLevel(newTotal);
    const leveledUp=newLevel.id!==oldLevel.id;
    const newSeenWords=[...(data.seenWords||[]),currentWord?.word].filter(Boolean);
    const updated={
      ...data,
      totalWords: newTotal,
      [todayKey]: newTodayCount,
      seenWords: newSeenWords.slice(-100)
    };
    appDataRef.current = updated;
    setAppData(updated);
    saveData(updated);
    if(currentWord) {
      await saveWordToReview(currentWord.word, currentWord.chineseMeaning, currentWord.partOfSpeech);
      setHistory(prev=>[...prev,currentWord]);
    }
    setRevealed(false);setSpeechPassed(false);
    if(leveledUp) setShowLevelUp(newLevel);
    if(wordQueue.length>0){
      const nextWord=wordQueue[0]; const newQueue=wordQueue.slice(1);
      setCurrentWord(nextWord); setWordQueue(newQueue);
      saveData({...updated,savedQueue:[nextWord,...newQueue]});
      appDataRef.current = {...updated,savedQueue:[nextWord,...newQueue]};
    } else {
      setCurrentWord(null);
      saveData({...updated,savedQueue:[]});
      appDataRef.current = {...updated,savedQueue:[]};
      loadMoreWords(updated);
    }
    if(wordQueue.length<=3) loadMoreWords(updated);
  }
  function handlePrev() {
    if(history.length===0) return;
    if(isInHistory&&currentIdx>0){setCurrentIdx(currentIdx-1);setCurrentWord(history[currentIdx-1]);}
    else if(!isInHistory){setCurrentIdx(history.length-1);setCurrentWord(history[history.length-1]);}
    setRevealed(false);setSpeechPassed(false);
  }
  function handleSetup(topic) {
    const newData={topic,totalWords:0,streak:0,lastCheckin:getToday(),createdAt:getToday()};
    setAppData(newData);
    appDataRef.current = newData;
    saveData(newData);
    setScreen("main");
    loadMoreWords(newData);
  }
  function handleReviewDone() {
    setReviews([]); setScreen("main");
    const latest = appDataRef.current;
    if(latest) startLearning(latest);
  }
  if(screen==="setup") return <SetupScreen onComplete={handleSetup}/>;
  const data=appData;
  const c=getTopicColor(data?.topic);
  const currentLevel=getCurrentLevel(data?.totalWords||0);
  const nextLevel=getNextLevel(data?.totalWords||0);
  const topicInfo=TOPICS.find(t=>t.id===data?.topic);
  const todayKey=`today_${getToday()}`;
  const todayCount=data?.[todayKey]||0;
  const wordsToNext=nextLevel?nextLevel.minWords-(data?.totalWords||0):null;
  const canGoPrev=history.length>0&&!(isInHistory&&currentIdx===0);
  return(
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh",background:`linear-gradient(160deg,${c.bg} 0%,#0a0a0f 70%)`}}>
      <style>{`
        @keyframes fadeInRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
        @keyframes fadeInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
        @keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes pop{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
        @keyframes levelUp{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
      `}</style>
      {showLevelUp&&<LevelUpModal level={showLevelUp} accent={c.accent} onClose={()=>setShowLevelUp(null)}/>}
      {showStreak&&(
        <div style={{position:"fixed",top:"16px",left:"50%",transform:"translateX(-50%)",zIndex:100,background:`${c.accent}ee`,borderRadius:"20px",padding:"10px 24px",display:"flex",alignItems:"center",gap:"8px",whiteSpace:"nowrap"}}>
          <span style={{fontSize:"20px"}}>🔥</span>
          <span style={{fontSize:"15px",fontWeight:"700",color:"#fff"}}>連續 {data?.streak} 天打卡！</span>
        </div>
      )}
      <div style={{padding:"12px 16px 10px",borderBottom:`1px solid ${c.accent}22`,flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",maxWidth:"460px",margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <span style={{fontSize:"13px",color:`${c.accent}cc`}}>{topicInfo?.emoji} {topicInfo?.label}</span>
            <span style={{fontSize:"11px",color:"#555"}}>·</span>
            <span style={{fontSize:"12px",color:"#666"}}>{currentLevel.emoji} {currentLevel.label}</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <div style={{fontSize:"12px",color:"#666"}}>
              今日 <span style={{color:c.accent,fontWeight:"700"}}>{todayCount}</span>
              <span style={{margin:"0 4px",color:"#444"}}>·</span>
              累積 <span style={{color:"#c77dff",fontWeight:"700"}}>{data?.totalWords||0}</span>
            </div>
            {reviewCount>0&&screen!=="review"&&(
              <button onClick={()=>setScreen("review")} style={{display:"inline-flex",alignItems:"center",gap:"4px",background:"#f5a62322",border:"1px solid #f5a62355",borderRadius:"14px",padding:"4px 10px",fontSize:"12px",color:"#f5a623",cursor:"pointer",fontWeight:"700"}}>
                🔁 {reviewCount}
              </button>
            )}
            <div style={{display:"inline-flex",alignItems:"center",gap:"4px",background:`${c.accent}18`,border:`1px solid ${c.accent}35`,borderRadius:"14px",padding:"4px 10px"}}>
              <span style={{fontSize:"14px"}}>🔥</span>
              <span style={{fontSize:"13px",fontWeight:"700",color:c.accent}}>{data?.streak||0}</span>
            </div>
          </div>
        </div>
        {nextLevel&&(
          <div style={{maxWidth:"460px",margin:"6px auto 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:"10px",color:"#444",marginBottom:"3px"}}>
              <span>{currentLevel.label}</span>
              <span>距離 {nextLevel.emoji}{nextLevel.label} 還差 {wordsToNext} 個</span>
            </div>
            <div style={{height:"3px",background:"rgba(255,255,255,0.07)",borderRadius:"3px",overflow:"hidden"}}>
              <div style={{height:"100%",background:c.accent,borderRadius:"3px",width:`${Math.min(100,((data?.totalWords||0)-currentLevel.minWords)/(nextLevel.minWords-currentLevel.minWords)*100)}%`,transition:"width 0.4s ease"}}/>
            </div>
          </div>
        )}
      </div>
      {screen==="review"&&activeTab==="learn"&&(
        <div style={{flex:1,overflowY:"auto"}}>
          <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:"14px",color:"#f5a623",fontWeight:"700"}}>
            🔁 今日複習（{reviews.length} 個）
          </div>
          <ReviewScreen reviews={reviews} accent={c.accent} onDone={handleReviewDone}/>
        </div>
      )}
      {screen==="main"&&activeTab==="learn"&&(
        <div style={{flex:1,overflowY:"auto",padding:"12px 14px 16px",maxWidth:"460px",margin:"0 auto",width:"100%"}}>
          {isInHistory&&(
            <div style={{textAlign:"center",marginBottom:"10px",padding:"5px",background:`${c.accent}18`,borderRadius:"8px",fontSize:"12px",color:c.accent}}>
              📖 回顧第 {currentIdx+1} / {history.length} 個
            </div>
          )}
          {!displayWord&&loading&&(
            <div style={{textAlign:"center",padding:"50px 20px"}}>
              <div style={{width:"36px",height:"36px",border:`3px solid ${c.accent}33`,borderTop:`3px solid ${c.accent}`,borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 14px"}}/>
              <div style={{fontSize:"13px",color:"#555"}}>AI 正在準備新單字...</div>
            </div>
          )}
          {loadError&&!displayWord&&(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:"44px",marginBottom:"12px"}}>😵</div>
              <div style={{fontSize:"14px",color:"#e94560",marginBottom:"20px"}}>{loadError}</div>
              <button onClick={()=>loadMoreWords(data)} style={{background:"#e94560",border:"none",color:"#fff",borderRadius:"12px",padding:"12px 28px",fontSize:"14px",cursor:"pointer",fontWeight:"700"}}>重新載入</button>
            </div>
          )}
          {displayWord&&(
            <div key={`${displayWord.word}-${currentIdx}`} style={{animation:isInHistory?"fadeInLeft 0.25s ease":"fadeInRight 0.25s ease"}}>
              <div style={{background:c.light,borderRadius:"18px 18px 0 0",padding:"18px 16px 16px",borderTop:`4px solid ${c.accent}`}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px"}}>
                  <div style={{flex:1,textAlign:"left"}}>
                    <div style={{fontSize:"10px",letterSpacing:"3px",color:c.accent,textTransform:"uppercase",marginBottom:"4px"}}>{displayWord.partOfSpeech}</div>
                    <div style={{fontSize:"32px",fontWeight:"700",color:"#fff",marginBottom:"4px",lineHeight:"1.1"}}>{displayWord.word}</div>
                    <div style={{fontSize:"12px",color:"rgba(255,255,255,0.4)",marginBottom:"10px"}}>{displayWord.pronunciation}</div>
                    <div style={{display:"inline-block",background:`${c.accent}22`,border:`1px solid ${c.accent}44`,borderRadius:"8px",padding:"6px 14px",fontSize:"15px",color:c.accent,fontWeight:"600"}}>
                      {displayWord.chineseMeaning}
                    </div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:"8px",flexShrink:0}}>
                    <button onClick={handleNext} style={{padding:"12px 14px",background:c.accent,border:"none",color:"#fff",borderRadius:"12px",fontSize:"13px",cursor:"pointer",fontWeight:"700",textAlign:"center",minWidth:"80px",lineHeight:"1.3"}}>
                      {speechPassed?"✅ 通過！":"學會了"}<br/>下一個 →
                    </button>
                    <button onClick={handlePrev} disabled={!canGoPrev} style={{padding:"8px 14px",background:canGoPrev?"rgba(255,255,255,0.1)":"rgba(255,255,255,0.03)",border:`1px solid ${canGoPrev?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.05)"}`,color:canGoPrev?"#ccc":"#444",borderRadius:"12px",fontSize:"12px",cursor:canGoPrev?"pointer":"default",textAlign:"center"}}>
                      ← 上一個
                    </button>
                  </div>
                </div>
              </div>
              <div style={{background:c.bg,padding:"14px 16px",borderLeft:`1px solid ${c.accent}22`,borderRight:`1px solid ${c.accent}22`}}>
                <SpeechPractice word={displayWord.word} accent={c.accent} onPass={()=>setSpeechPassed(true)}/>
              </div>
              <div style={{background:c.bg,borderLeft:`1px solid ${c.accent}22`,borderRight:`1px solid ${c.accent}22`,padding:"14px 16px 0"}}>
                <div style={{marginBottom:"12px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
                    <span style={{fontSize:"10px",letterSpacing:"2px",color:"#555",textTransform:"uppercase"}}>例句 1</span>
                    <SpeakBtn text={displayWord.example1} label="聽" accent={c.accent} rate={0.82}/>
                  </div>
                  <div style={{fontSize:"14px",color:"#e8e4de",lineHeight:"1.7",fontStyle:"italic",marginBottom:"4px"}}>"{displayWord.example1}"</div>
                  <div style={{fontSize:"12px",color:"#666"}}>{displayWord.example1Translation}</div>
                </div>
                <div style={{borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:"12px",marginBottom:"12px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
                    <span style={{fontSize:"10px",letterSpacing:"2px",color:"#555",textTransform:"uppercase"}}>例句 2</span>
                    <SpeakBtn text={displayWord.example2} label="聽" accent={c.accent} rate={0.82}/>
                  </div>
                  <div style={{fontSize:"14px",color:"#e8e4de",lineHeight:"1.7",fontStyle:"italic",marginBottom:"4px"}}>"{displayWord.example2}"</div>
                  {revealed
                    ?<div style={{fontSize:"12px",color:"#666"}}>{displayWord.example2Translation}</div>
                    :<button onClick={()=>setRevealed(true)} style={{background:"none",border:"1px solid rgba(255,255,255,0.1)",color:"#777",borderRadius:"8px",padding:"4px 12px",fontSize:"12px",cursor:"pointer"}}>顯示翻譯</button>
                  }
                </div>
                <div style={{padding:"12px",background:`${c.accent}11`,borderRadius:"10px",border:`1px solid ${c.accent}22`,marginBottom:"14px"}}>
                  <div style={{fontSize:"10px",letterSpacing:"2px",color:c.accent,textTransform:"uppercase",marginBottom:"5px"}}>💡 記憶小技巧</div>
                  <div style={{fontSize:"13px",color:"rgba(255,255,255,0.65)",lineHeight:"1.6"}}>{displayWord.tip}</div>
                </div>
              </div>
              <div style={{background:c.bg,borderRadius:"0 0 18px 18px",border:`1px solid ${c.accent}22`,borderTop:"none",height:"16px"}}/>
            </div>
          )}
        </div>
      )}
      {activeTab==="chat"&&(
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <ConversationScreen appData={appData} accent={c.accent}/>
        </div>
      )}
      <div style={{borderTop:`1px solid ${c.accent}22`,background:"rgba(0,0,0,0.6)",flexShrink:0,display:"flex",alignItems:"stretch"}}>
        {[
          {id:"learn",label:"學習",emoji:"📚"},
          {id:"chat",  label:"對話",emoji:"💬"},
        ].map(tab=>(
          <button key={tab.id} onClick={()=>{ setActiveTab(tab.id); }} style={{flex:1,padding:"10px 6px 8px",background:"none",border:"none",color:activeTab===tab.id?c.accent:"#555",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px",transition:"color 0.2s"}}>
            <span style={{fontSize:"20px"}}>{tab.emoji}</span>
            <span style={{fontSize:"10px",fontWeight:activeTab===tab.id?"700":"400",letterSpacing:"1px"}}>{tab.label}</span>
            {activeTab===tab.id&&<div style={{width:"20px",height:"2px",background:c.accent,borderRadius:"2px"}}/>}
          </button>
        ))}
        <button onClick={()=>{if(confirm("重新設定主題？")){const d={...appDataRef.current};delete d.topic;delete d.savedQueue;saveData(d);setScreen("setup");setHistory([]);setWordQueue([]);setCurrentWord(null);setCurrentIdx(-1);}}} style={{width:"52px",padding:"10px 6px 8px",background:"none",border:"none",color:"#444",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px",borderLeft:`1px solid ${c.accent}15`}}>
          <span style={{fontSize:"18px"}}>⚙️</span>
          <span style={{fontSize:"10px",letterSpacing:"1px"}}>設定</span>
        </button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
